[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-inbox-triage-backend"
version = "0.1.0"
description = "FastAPI backend for Smart Inbox Triage Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "httpx",
    "aiohttp",
    "apscheduler",
    "structlog",
    "python-json-logger",
    "cryptography",
    "python-dotenv",
    "waitress"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx"
]
